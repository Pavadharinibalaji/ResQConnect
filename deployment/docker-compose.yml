version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: resqconnect_db
    restart: unless-stopped
    # Load settings parameters from production environment file (Task 10 & 12)
    env_file:
      - ../backend/.env.production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resqconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: resqconnect_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env.production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Query versioned healthcheck endpoint (Task 6 & 9)
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
